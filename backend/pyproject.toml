[project]
name = "backend"
version = "0.1.0"
description = "Backend service for KapraOS"
readme = "README.md"
authors = [
    { name = "Tayyab", email = "igntayyab@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.12"
# The pydantic plugin lets mypy understand that BaseSettings fields are
# populated from the environment (e.g. `database_url`), instead of flagging
# them as missing constructor arguments.
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

