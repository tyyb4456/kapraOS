[project]
name = "backend"
version = "0.1.0"
description = "Backend service for KapraOS"
readme = "README.md"
authors = [
    { name = "Tayyab", email = "igntayyab@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "av>=18.1.0",
    "deepagents>=0.7.19",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-cloudflare>=0.3.10",
    "langchain-fireworks>=1.3.1",
    "langchain[openai]>=1.4.2",
    "livekit-agents>=1.7.0,<2.0.0",
    "livekit-api>=1.0.0",
    "mypy>=2.3.1",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "redis>=5.0.0",
    "ruff>=0.16.9",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.12"
# The pydantic plugin lets mypy understand that BaseSettings fields are
# populated from the environment (e.g. `database_url`), instead of flagging
# them as missing constructor arguments.
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

